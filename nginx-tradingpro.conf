# ═══════════════════════════════════════════════════════════════
# TradingProSystem — Nginx: Frontend (estático) + Backend (proxy)
# Ubicación en el VPS: /etc/nginx/sites-available/tradingpro
#
# v5.2 — HTTPS/TLS + HSTS + Hardening
# ═══════════════════════════════════════════════════════════════

# Rate limiting — protege el backend contra sobrecarga (DoS / bucles)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ═══════════════════════════════════════════════════════════════
# REDIRECCIÓN HTTP → HTTPS (obligatorio)
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name 165.22.186.25;

    # Necesario para renovación automática de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Todo lo demás → redirigir a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════
# SERVIDOR HTTPS PRINCIPAL
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name 165.22.186.25;

    # ── Certificados SSL (generados por Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/165.22.186.25/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/165.22.186.25/privkey.pem;

    # ── TLS moderno (PCI-DSS compatible) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── OCSP Stapling (mejora rendimiento de validación) ──
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Logs para auditoría
    access_log /var/log/nginx/tradingpro_access.log;
    error_log  /var/log/nginx/tradingpro_error.log;

    # Tamaño máximo de payload (POST /api/config y /api/run-scanner)
    client_max_body_size 10M;

    # ═══════════════════════════════════════════════════════════
    # HEADERS DE SEGURIDAD — Hardening Nginx
    # ═══════════════════════════════════════════════════════════
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy básico: permite recursos del mismo origen
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;" always;
    # HSTS: forzar HTTPS por 1 año (activar SOLO después de verificar que HTTPS funciona)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ═══════════════════════════════════════════════════════════
    # FRONTEND ESTÁTICO — React/Vite build
    # ═══════════════════════════════════════════════════════════
    root /var/www/TradingProSystem/frontend/dist;
    index index.html;

    # Archivos estáticos (JS, CSS, imágenes, fuentes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════
    # BACKEND API — FastAPI + Uvicorn en puerto 8000
    # ═══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras para IP real del cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts extendidos para escaneos
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Rate limiting por IP (burst=20 permite ráfagas cortas sin penalizar)
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Desactivar buffering SOLO para /api/chart-data (respuestas grandes)
    location /api/chart-data {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ═══════════════════════════════════════════════════════════
    # SEGURIDAD: Bloquear acceso a archivos sensibles
    # ═══════════════════════════════════════════════════════════

    # Bloquear archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Bloquear base de datos, modelos ML, código fuente y logs
    location ~ \.(db|db-shm|db-wal|pkl|py|pyc|log)$ {
        deny all;
        return 404;
    }

    # Bloquear directorio .git
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Bloquear acceso a .env y archivos de configuración sensibles
    location ~ /\.env {
        deny all;
        return 404;
    }

    # ═══════════════════════════════════════════════════════════
    # SPA Fallback — cualquier ruta no encontrada sirve index.html
    # ═══════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }
}