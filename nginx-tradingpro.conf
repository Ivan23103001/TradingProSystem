# ═══════════════════════════════════════════════════════════════
# TradingProSystem — Nginx: Frontend (estático) + Backend (proxy)
# Ubicación en el VPS: /etc/nginx/sites-available/tradingpro
# ═══════════════════════════════════════════════════════════════

# Rate limiting — protege el backend contra sobrecarga (DoS / bucles)
# Documentado en SYSTEM_INTEGRITY.md punto 17
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name 165.22.186.25;  # ← Cambiar por tu IP o dominio real

    # Logs para auditoría
    access_log /var/log/nginx/tradingpro_access.log;
    error_log  /var/log/nginx/tradingpro_error.log;

    # Tamaño máximo de payload (POST /api/config y /api/run-scanner)
    client_max_body_size 10M;

    # ═══════════════════════════════════════════════════════════
    # FRONTEND ESTÁTICO — React/Vite build
    # ═══════════════════════════════════════════════════════════
    root /root/TradingProSystem/frontend/dist;
    index index.html;

    # Archivos estáticos (JS, CSS, imágenes, fuentes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════
    # BACKEND API — FastAPI + Uvicorn en puerto 8000
    # ═══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras para IP real del cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts extendidos para escaneos
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Rate limiting por IP (burst=20 permite ráfagas cortas sin penalizar)
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Desactivar buffering SOLO para /api/chart-data (respuestas grandes)
    # Documentado en SYNC_PROTOCOL.md línea 22
    location /api/chart-data {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ═══════════════════════════════════════════════════════════
    # SEGURIDAD: Bloquear acceso a archivos sensibles
    # Documentado en SYSTEM_INTEGRITY.md punto 14
    # ═══════════════════════════════════════════════════════════

    # Bloquear archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Bloquear base de datos, modelos ML, código fuente y logs
    location ~ \.(db|db-shm|db-wal|pkl|py|pyc|log)$ {
        deny all;
        return 404;
    }

    # Bloquear directorio .git
    location ~ /\.git {
        deny all;
        return 404;
    }

    # ═══════════════════════════════════════════════════════════
    # SPA Fallback — cualquier ruta no encontrada sirve index.html
    # ═══════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }
}